<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>W4Y Student Biography</title>
<style>
  :root{ --plum:#1A0B2E; --coral:#FF6B6B; --magenta:#D63AFF; --gold:#F5C453; --card:#241539; --border:rgba(255,255,255,.12); --muted:#b8a8d0; }
  *{box-sizing:border-box;}
  body{ margin:0; min-height:100vh; background:linear-gradient(160deg,var(--plum),#150822);
    font-family:'Poppins','Inter',sans-serif; color:#fff; padding:24px; }
  .wrap{ max-width:640px; margin:0 auto; }
  header{ margin-bottom:20px; }
  h1{ font-size:20px; margin:0 0 4px; }
  .sub{ color:var(--muted); font-size:13px; }
  .lookup-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:20px; margin-bottom:24px; }
  .lookup-row{ display:flex; gap:8px; }
  input{ flex:1; padding:12px 14px; border-radius:10px; border:1px solid var(--border);
    background:rgba(255,255,255,.06); color:#fff; font-size:14px; }
  input:focus{ outline:none; border-color:var(--gold); }
  button{ padding:12px 20px; border:none; border-radius:10px; font-weight:700; font-size:13.5px;
    background:linear-gradient(135deg,var(--coral),var(--magenta)); color:#fff; cursor:pointer; white-space:nowrap; }
  button:disabled{ opacity:.6; cursor:not-allowed; }
  .msg{ margin-top:12px; font-size:13px; padding:10px 12px; border-radius:10px; display:none; }
  .msg.err{ display:block; background:rgba(255,107,107,.15); border:1px solid rgba(255,107,107,.4); color:#FF9B9B; }

  #bioArea{ display:none; }
  .bio-header{ background:linear-gradient(135deg, rgba(214,58,255,.2), rgba(255,107,107,.15));
    border:1px solid var(--border); border-radius:20px; padding:24px; margin-bottom:24px; text-align:center;
    animation: bio-fade-in 0.8s ease-out; }
  @keyframes bio-fade-in{ from{opacity:0; transform:translateY(10px);} to{opacity:1; transform:translateY(0);} }
  .bio-name{ font-size:24px; font-weight:700; margin:0 0 6px; }
  .bio-meta{ color:var(--muted); font-size:13px; }
  .bio-coins{ display:inline-block; margin-top:12px; background:rgba(245,196,83,.15); border:1px solid rgba(245,196,83,.4);
    border-radius:20px; padding:6px 16px; font-size:13px; color:var(--gold); font-weight:700; }

  .section-title{ font-size:13px; text-transform:uppercase; letter-spacing:.05em; color:var(--gold); font-weight:700; margin:24px 0 12px; }

  .highlight-row{ display:flex; gap:12px; overflow-x:auto; padding-bottom:8px; margin-bottom:8px; }
  .highlight-card{ flex:0 0 auto; width:150px; background:linear-gradient(135deg, rgba(245,196,83,.15), rgba(255,107,107,.1));
    border:1px solid rgba(245,196,83,.4); border-radius:14px; padding:14px; text-align:center;
    opacity:0; animation: card-reveal 0.6s ease-out forwards; }
  @keyframes card-reveal{ from{opacity:0; transform:scale(.9) translateY(8px);} to{opacity:1; transform:scale(1) translateY(0);} }
  .highlight-icon{ font-size:28px; margin-bottom:6px; }
  .highlight-label{ font-size:11.5px; font-weight:600; line-height:1.3; }
  .highlight-tag{ font-size:10px; color:var(--muted); margin-top:4px; }

  .timeline{ position:relative; padding-left:28px; }
  .timeline::before{ content:''; position:absolute; left:9px; top:6px; bottom:6px; width:2px; background:var(--border); }
  .tl-item{ position:relative; margin-bottom:16px; opacity:0; animation: tl-fade 0.5s ease-out forwards; }
  .tl-dot{ position:absolute; left:-28px; top:4px; width:18px; height:18px; border-radius:50%;
    background:var(--card); border:2px solid var(--magenta); }
  .tl-content{ background:var(--card); border:1px solid var(--border); border-radius:12px; padding:12px 14px; }
  .tl-event{ font-weight:600; font-size:13.5px; margin-bottom:2px; }
  .tl-detail{ font-size:11.5px; color:var(--muted); }
  @keyframes tl-fade{ from{opacity:0; transform:translateX(-8px);} to{opacity:1; transform:translateX(0);} }

  .gift-footer{ text-align:center; margin-top:28px; padding:20px; border-top:1px dashed var(--border); color:var(--muted); font-size:12.5px; }
</style>
</head>
<body>
<div class="wrap">

<header>
  <h1>🎓 Student Biography</h1>
  <p class="sub" id="schoolLabel">Animated journey recap — a graduation gift for passing-out students.</p>
</header>

<div class="lookup-card">
  <label style="font-size:12.5px; color:var(--muted); display:block; margin-bottom:8px;">Enter the student's W4Y Student ID</label>
  <div class="lookup-row">
    <input type="text" id="studentIdInput" placeholder="W4Y-XXXXXX">
    <button id="lookupBtn">Look Up →</button>
  </div>
  <div id="msg" class="msg"></div>
</div>

<div id="bioArea"></div>

</div>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";
import { getFirestore, doc, getDoc, collection, query, where, getDocs } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";

const firebaseConfig = {
  apiKey: "AIzaSyDiT99vqJkMZ2Td81YVDTYT5W9HWz2M54o",
  authDomain: "waves4youth-4f239.firebaseapp.com",
  projectId: "waves4youth-4f239",
  storageBucket: "waves4youth-4f239.firebasestorage.app",
  messagingSenderId: "828101805925",
  appId: "1:828101805925:web:f4cd245254aed07ec9438c"
};

const app = getApps().length ? getApps()[0] : initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getFirestore(app);

const $ = id => document.getElementById(id);
const setMsg = (t) => { const m=$("msg"); m.textContent=t; m.className = t ? "msg err" : "msg"; };

// Guard: only signed-in, authorized school admins (or W4Y admin) reach this page.
// Every other visitor gets redirected straight to the login gate.
onAuthStateChanged(auth, async (user) => {
  if (!user) { window.location.href = "w4y-school-admin-login.html"; return; }
  const adminDoc = await getDoc(doc(db, "schoolAdmins", user.uid));
  if (!adminDoc.exists() || adminDoc.data().active === false) {
    window.location.href = "w4y-school-admin-login.html";
    return;
  }
  const schoolName = adminDoc.data().schoolName || sessionStorage.getItem("w4y_school_name") || "";
  if (schoolName) $("schoolLabel").textContent = `${schoolName} — animated journey recap for passing-out students.`;
});

// Heuristic for what counts as a "highlight": capstone/final months, or
// event names containing certain milestone keywords. biographyEvents
// doesn't explicitly flag this today, so we detect it from the text itself.
function isHighlight(event){
  const text = (event.event || "").toLowerCase();
  return text.includes("capstone") || text.includes("celebrate") || text.includes("badge") ||
         text.includes("year highlights") || text.includes("journey") || text.includes("complete case");
}

function iconForEvent(event){
  const text = (event.event || "").toLowerCase();
  if (text.includes("capstone") || text.includes("complete case")) return "🏆";
  if (text.includes("celebrate") || text.includes("badge")) return "🎉";
  if (text.includes("heart")) return "❤️";
  if (text.includes("brain") || text.includes("nerve")) return "🧠";
  if (text.includes("bone") || text.includes("skeleton")) return "🦴";
  return "✨";
}

$("lookupBtn").addEventListener("click", async () => {
  const studentId = $("studentIdInput").value.trim().toUpperCase();
  if (!studentId) { setMsg("Please enter a Student ID."); return; }

  $("lookupBtn").disabled = true;
  $("lookupBtn").textContent = "Looking up...";
  setMsg("");
  $("bioArea").style.display = "none";

  try {
    const q = query(collection(db, "students"), where("studentId", "==", studentId));
    const snap = await getDocs(q);
    if (snap.empty) {
      setMsg("No student found with that ID. Double-check and try again.");
      $("lookupBtn").disabled = false;
      $("lookupBtn").textContent = "Look Up →";
      return;
    }

    const student = snap.docs[0].data();
    renderBiography(student);
  } catch (e) {
    console.error(e);
    setMsg("Something went wrong looking that up — check the console for details.");
  }
  $("lookupBtn").disabled = false;
  $("lookupBtn").textContent = "Look Up →";
});

function renderBiography(student){
  const events = student.biographyEvents || [];
  const highlights = events.filter(isHighlight);
  const sorted = [...events].sort((a,b) => new Date(a.at) - new Date(b.at));

  const bioArea = $("bioArea");
  bioArea.style.display = "block";
  bioArea.innerHTML = `
    <div class="bio-header">
      <div class="bio-name">${student.name || "A W4Y Student"}</div>
      <div class="bio-meta">Student ID: ${student.studentId || "—"} &nbsp;•&nbsp; Std ${student.grade || "—"}</div>
      <div class="bio-coins">🪙 ${student.coins || 0} coins earned across the journey</div>
    </div>

    ${highlights.length ? `
    <div class="section-title">✨ Highlight Moments</div>
    <div class="highlight-row">
      ${highlights.map((h,i) => `
        <div class="highlight-card" style="animation-delay:${i*0.12}s;">
          <div class="highlight-icon">${iconForEvent(h)}</div>
          <div class="highlight-label">${h.event || ""}</div>
          <div class="highlight-tag">${h.profession ? h.profession.replace(/-/g,' ') : ''} ${h.grade ? '· Std '+h.grade : ''}</div>
        </div>
      `).join('')}
    </div>` : ''}

    <div class="section-title">📖 Full Journey Timeline</div>
    <div class="timeline">
      ${sorted.map((e,i) => `
        <div class="tl-item" style="animation-delay:${Math.min(i*0.05, 2)}s;">
          <div class="tl-dot"></div>
          <div class="tl-content">
            <div class="tl-event">${iconForEvent(e)} ${e.event || ""}</div>
            <div class="tl-detail">${e.profession ? e.profession.replace(/-/g,' ') : ''} ${e.grade ? '· Std '+e.grade : ''} ${e.at ? '· '+new Date(e.at).toLocaleDateString() : ''}</div>
          </div>
        </div>
      `).join('')}
    </div>

    <div class="gift-footer">🎓 A graduation gift from Waves4Youth — celebrating this student's journey of curiosity and growth.</div>
  `;
}
</script>
</body>
</html>
