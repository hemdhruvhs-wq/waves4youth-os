<!DOCTYPE html>

<head>

<title>My Future Profession | Waves4Youth</title>
<style>
:root{ --bg:#0F0B1E; --card:#171227; --border:rgba(255,255,255,.12); --muted:#A99FC4; --gold:#FFD166; --grad1:#B45CFF; --grad2:#FF6B6B; }
*{box-sizing:border-box;margin:0;padding:0;}
body{ background:var(--bg); color:#fff; font-family:-apple-system,Segoe UI,Roboto,sans-serif; padding-bottom:60px; }
.wrap{ max-width:720px; margin:0 auto; padding:0 18px; }
header{ padding:20px 18px; border-bottom:1px solid var(--border); }
.eyebrow{ color:var(--gold); font-size:12px; font-weight:700; letter-spacing:.06em; }
h1{ font-size:26px; margin-top:6px; }
.coin-pill{ display:inline-block; background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.3); color:var(--gold); padding:6px 14px; border-radius:999px; font-size:13px; font-weight:600; margin-top:10px; }

.lock-panel{ text-align:center; padding:60px 20px; }
.lock-panel h2{ font-size:22px; margin-bottom:10px; }
.lock-panel p{ color:var(--muted); font-size:14.5px; margin-bottom:24px; line-height:1.5; }
.plan-card{ background:var(--card); border:1px solid var(--border); border-radius:16px; padding:22px; max-width:340px; margin:0 auto 14px; text-align:left; }
.plan-price{ font-size:28px; font-weight:800; margin:6px 0; }
.plan-btn{ width:100%; margin-top:14px; padding:12px; border-radius:10px; border:none; background:linear-gradient(90deg,var(--grad1),var(--grad2)); color:#fff; font-weight:600; }

.month-tabs{ display:flex; gap:8px; overflow-x:auto; padding:16px 18px; }
.month-tabs button{ flex:none; padding:8px 14px; border-radius:999px; border:1px solid var(--border); background:transparent; color:#fff; font-size:12.5px; }
.month-tabs button.active{ background:linear-gradient(90deg,var(--grad1),var(--grad2)); border:none; }
.month-tabs button.locked{ opacity:.4; }

.task-grid{ display:grid; grid-template-columns:1fr 1fr; gap:12px; padding:0 18px; }
.task-card{ background:var(--card); border:1px solid var(--border); border-radius:14px; padding:14px; cursor:pointer; }
.task-card.done{ border-color:var(--gold); }
.task-card.needs-revision{ border-color:#FF7A33; }
.task-icon{ font-size:22px; }
.task-type{ font-size:10.5px; color:var(--muted); text-transform:uppercase; margin-top:6px; }
.task-title{ font-size:14px; font-weight:600; margin-top:4px; }
.task-badge{ font-size:11px; color:var(--gold); margin-top:6px; }

.sp-modal-overlay{ display:none; position:fixed; inset:0; background:rgba(6,4,20,.75); z-index:200; align-items:center; justify-content:center; padding:20px; }
.sp-modal{ background:#141026; border:1px solid var(--border); border-radius:16px; padding:24px; max-width:480px; width:100%; position:relative; }
.sp-modal-close{ position:absolute; top:12px; right:16px; background:none; border:none; color:#fff; font-size:22px; }
.sp-modal-desc{ color:var(--muted); font-size:13.5px; margin:6px 0 14px; }
.sp-modal textarea{ width:100%; background:rgba(255,255,255,.05); border:1px solid var(--border); border-radius:10px; color:#fff; padding:12px; font-size:14px; font-family:inherit; resize:vertical; }
.sp-feedback{ margin-top:12px; padding:12px; background:rgba(180,92,255,.12); border-radius:10px; font-size:13.5px; color:#e8ddff; }
.sp-status{ margin-top:8px; font-size:12.5px; color:var(--muted); min-height:16px; }
.sp-submit-btn{ margin-top:14px; width:100%; padding:12px; border-radius:10px; border:none; background:linear-gradient(90deg,var(--grad1),var(--grad2)); color:#fff; font-weight:600; }
.sp-submit-btn:disabled{ opacity:.6; }

#loadingMsg{ text-align:center; padding:60px 20px; color:var(--muted); }

.band-tag{ display:inline-block; background:rgba(255,209,102,.12); border:1px solid rgba(255,209,102,.3); color:var(--gold); padding:4px 12px; border-radius:999px; font-size:11.5px; font-weight:700; margin-top:8px; }

/* ---- Visual mission engines (tap-discover, build-match) ---- */
.vm-overlay{ display:none; position:fixed; inset:0; background:rgba(6,4,20,.85); z-index:250; align-items:center; justify-content:center; padding:20px; }
.vm-modal{ background:#141026; border:1px solid var(--border); border-radius:18px; padding:22px; max-width:480px; width:100%; max-height:90vh; overflow-y:auto; position:relative; }
.vm-close{ position:absolute; top:12px; right:16px; background:none; border:none; color:#fff; font-size:22px; cursor:pointer; }
.vm-title{ font-size:17px; font-weight:700; margin:0 0 14px; padding-right:24px; }

.td-visual{ font-size:110px; text-align:center; margin-bottom:10px; animation:tdBeat 1.3s infinite ease-in-out; line-height:1.1; }
@keyframes tdBeat{ 0%,100%{transform:scale(1)} 20%{transform:scale(1.12)} 40%{transform:scale(.98)} 60%{transform:scale(1.08)} }
@media (prefers-reduced-motion: reduce){ .td-visual{ animation:none; } }

/* ============ REUSABLE ANIMATION LIBRARY (10 patterns) ============ */
.anim-stage{ width:180px; height:180px; margin:0 auto 10px; display:flex; align-items:center; justify-content:center; position:relative; }
/* 1. heartbeat */
.a-heart-ring{ position:absolute; width:70px; height:70px; border-radius:50%; border:2px solid #FF6B6B; opacity:0; animation:a-heart-ripple 1.1s ease-out infinite; }
.a-heart-shape{ width:70px; height:70px; fill:#FF6B6B; animation:a-heartbeat 1.1s ease-in-out infinite; transform-origin:center; filter:drop-shadow(0 0 12px rgba(255,107,107,.6)); }
@keyframes a-heartbeat{ 0%,100%{transform:scale(1)} 14%{transform:scale(1.18)} 28%{transform:scale(1)} 42%{transform:scale(1.1)} 56%{transform:scale(1)} }
@keyframes a-heart-ripple{ 0%{transform:scale(1);opacity:.6} 100%{transform:scale(2.2);opacity:0} }
/* 2. ecg */
.a-ecg-box{ width:160px; height:80px; }
.a-ecg-line{ animation:a-ecg-scroll 2.4s linear infinite; }
@keyframes a-ecg-scroll{ from{transform:translateX(0)} to{transform:translateX(-50%)} }
/* 3. breathing */
.a-chest-svg{ width:150px; height:170px; }
.a-lung-shape{ fill:url(#aLungGrad); animation:a-breathe 3.4s ease-in-out infinite; transform-origin:50% 15%; }
.a-lung-shape.a-right{ animation-delay:.08s; }
@keyframes a-breathe{ 0%,100%{transform:scale(.86);opacity:.82} 50%{transform:scale(1.06);opacity:1} }
.a-diaphragm{ stroke:#F5C453; stroke-width:3; fill:none; stroke-linecap:round; animation:a-diaphragm-move 3.4s ease-in-out infinite; }
@keyframes a-diaphragm-move{ 0%,100%{transform:translateY(4px)} 50%{transform:translateY(-6px)} }
/* 4. bloodflow */
.a-vessel-path{ width:170px; height:90px; }
.a-blood-dot{ r:5; fill:#FF6B6B; filter:drop-shadow(0 0 4px rgba(255,107,107,.9)); offset-path:path("M10,45 C50,10 120,80 165,45"); animation:a-flow 2.5s linear infinite; }
@keyframes a-flow{ 0%{offset-distance:0%} 100%{offset-distance:100%} }
/* 5. nervesignal */
.a-nerve-path{ width:170px; height:90px; }
.a-nerve-spark{ r:6; fill:#F5C453; filter:drop-shadow(0 0 8px rgba(245,196,83,1)); offset-path:path("M10,20 L45,70 L80,15 L115,70 L160,20"); animation:a-spark-move 1.3s linear infinite; }
@keyframes a-spark-move{ 0%{offset-distance:0%} 100%{offset-distance:100%} }
/* 6. celldivide */
.a-cell-stage{ width:100px; height:60px; position:relative; }
.a-cell{ position:absolute; top:50%; left:50%; width:36px; height:36px; border-radius:50%; background:radial-gradient(circle at 35% 35%,#C9A6FF,#D63AFF); transform:translate(-50%,-50%); animation:a-divide 2.6s ease-in-out infinite; }
.a-cell.a-b{ animation-name:a-divide-b; }
@keyframes a-divide{ 0%,15%{transform:translate(-50%,-50%) scale(1)} 50%{transform:translate(-130%,-50%) scale(.75)} 85%,100%{transform:translate(-130%,-50%) scale(.75)} }
@keyframes a-divide-b{ 0%,15%{transform:translate(-50%,-50%) scale(0);opacity:0} 50%{transform:translate(30%,-50%) scale(.75);opacity:1} 85%,100%{transform:translate(30%,-50%) scale(.75);opacity:1} }
/* 7. xray */
.a-xray-stage{ width:130px; height:150px; border-radius:8px; position:relative; overflow:hidden; background:#050208; border:1px solid rgba(255,255,255,.15); }
.a-xray-bone-line{ fill:none; stroke:rgba(230,235,255,.75); stroke-width:2.5; stroke-linecap:round; filter:drop-shadow(0 0 3px rgba(200,220,255,.5)); }
.a-xray-spine-seg{ fill:rgba(230,235,255,.7); }
.a-xray-sweep{ position:absolute; left:0; right:0; height:30px; background:linear-gradient(180deg,transparent,rgba(255,255,255,.5),transparent); animation:a-sweep 2.4s ease-in-out infinite; }
@keyframes a-sweep{ 0%{top:-12%} 100%{top:100%} }
/* 8. shield */
.a-shield-stage{ width:80px; height:80px; position:relative; display:flex; align-items:center; justify-content:center; }
.a-shield-icon{ font-size:34px; z-index:2; filter:drop-shadow(0 0 10px rgba(76,224,179,.8)); }
.a-shield-wave{ position:absolute; width:80px; height:80px; border-radius:50%; border:2px solid #4CE0B3; opacity:0; animation:a-shield-pulse 1.8s ease-out infinite; }
.a-shield-wave.a-d2{ animation-delay:.6s; } .a-shield-wave.a-d3{ animation-delay:1.2s; }
@keyframes a-shield-pulse{ 0%{transform:scale(.6);opacity:.8} 100%{transform:scale(1.6);opacity:0} }
/* 9. germ */
.a-germ{ font-size:70px; display:inline-block; animation:a-wiggle .9s ease-in-out infinite; }
@keyframes a-wiggle{ 0%,100%{transform:rotate(-8deg) translateX(0)} 25%{transform:rotate(6deg) translateX(3px)} 50%{transform:rotate(-4deg) translateX(-3px)} 75%{transform:rotate(8deg) translateX(2px)} }
/* 10. skeleton (friendly, general-purpose) */
.a-skel-stage{ position:relative; }
.a-skel-stage svg{ animation:a-friendly-bounce 1.8s ease-in-out infinite; }
@keyframes a-friendly-bounce{ 0%,100%{transform:translateY(0) rotate(0deg)} 25%{transform:translateY(-4px) rotate(-2deg)} 75%{transform:translateY(-2px) rotate(2deg)} }
.a-skel-ring{ position:absolute; top:50%; left:50%; width:100px; height:100px; border-radius:50%; border:3px solid #F5C453; transform:translate(-50%,-50%); animation:a-highlight-pulse 1.6s ease-in-out infinite; box-shadow:0 0 16px rgba(245,196,83,.7); }
@keyframes a-highlight-pulse{ 0%,100%{opacity:.4;transform:translate(-50%,-50%) scale(.9)} 50%{opacity:1;transform:translate(-50%,-50%) scale(1.08)} }
@media (prefers-reduced-motion: reduce){
  .a-heart-shape,.a-heart-ring,.a-ecg-line,.a-lung-shape,.a-diaphragm,.a-blood-dot,.a-nerve-spark,.a-cell,
  .a-xray-sweep,.a-shield-wave,.a-germ,.a-skel-stage svg,.a-skel-ring{ animation:none !important; }
}

    videoEl.addEventListener('loadedmetadata', () => {
      videoEl.style.display = 'block';
      document.getElementById('mentorMediaRow').style.display = 'flex';
    });
    videoEl.src = videoPath;
  })();
  window.w4yReady.then(() => {
    uid = window.w4yStudent.uid;
    bootstrap().catch(e => {
      console.error('learn-profession bootstrap failed', e);
      document.getElementById('loadingMsg').textContent = "Couldn't load this program — please check your connection and try again.";
    });
  });
}

async function bootstrap(){
  const snap = await getDoc(doc(db, 'students', uid));
  student = snap.exists() ? snap.data() : {};
  coins = student.coins || 0;
  document.getElementById('loadingMsg').style.display = 'none';
  document.getElementById('app').style.display = 'block';
  renderCoins();

  // CRITICAL: MissionEngine keeps its own internal record of which tasks are
  // passed, used by isMonthUnlocked()/getSubmission() — but that record only
  // gets populated inside init(). Without calling this, month-unlock checks
  // silently check against nothing, no matter what's actually in Firestore.
  // We handle grade-based CONTENT selection ourselves (getGradeBand below),
  // so this is intentionally a "gradeless track" from MissionEngine's point
  // of view — no gradeOrder passed, no grade-tab locking from this engine.
  await MissionEngine.init({ db, uid, trackSlug: SLUG, onReady: () => {} });

  const bandInfo = getGradeBand();
  if (bandInfo){
    const tag = document.getElementById('bandTag');
    tag.textContent = bandInfo.band + ' · Std ' + (overrideGrade || student.grade || '?');
    tag.style.display = 'inline-block';
  }

  // Master test view: only ever shown for accounts explicitly flagged as
  // test accounts in Firestore. Lets you jump between every built grade
  // instantly, client-side, without touching the database each time.
  if (student.isTestAccount && PROFILE.grades){
    document.getElementById('testGradeSwitcher').style.display = 'block';
    renderTestGradeButtons();
  }

  // Fully paid/enrolled students always get in. Everyone else still gets in —
  // they're on a free preview, capped per-task inside renderTasks().
  const unlocked = ProfessionAccess.isUnlocked(student, SLUG);
  if (PROFILE.grades && getMonths().length === 0){
    showNotReadyForGrade();
    return;
  }
  showMissions();
  if (!unlocked) showPreviewBanner();
}

// Resolves the right content for this student: grade-banded professions look up
// PROFILE.grades[student.grade]; older professions fall back to PROFILE.months
// directly, so nothing else on the site needs to change.
function getGradeBand(){
  if (!PROFILE.grades) return null;
  // Test accounts can override which grade's content shows via the switcher
  // UI below, without touching Firestore. Real students never set this.
  if (overrideGrade) return PROFILE.grades[overrideGrade] || null;
  // TEMPORARY: registration doesn't collect grade yet, so default to "6"
  // (the only grade with content right now) instead of showing nothing.
  // Remove this fallback once the signup form collects a real grade.
  const g = String(student.grade || '6');
  return PROFILE.grades[g] || null;
}
function getMonths(){
  const band = getGradeBand();
  if (band) return band.months;
  return PROFILE.months || [];
}

function renderTestGradeButtons(){
  const btnRow = document.getElementById('testGradeButtons');
  const builtGrades = Object.keys(PROFILE.grades).sort((a,b) => parseInt(a) - parseInt(b));
  const currentGrade = overrideGrade || String(student.grade || '6');
  btnRow.innerHTML = builtGrades.map(g => {
    const isActive = currentGrade === g;
    return `<button data-grade="${g}" style="padding:6px 14px; border-radius:8px; border:1px solid ${isActive ? 'var(--gold)' : 'var(--border)'}; background:${isActive ? 'var(--gold)' : 'rgba(255,255,255,.06)'}; color:${isActive ? '#1A0B2E' : '#fff'}; font-weight:${isActive ? '700' : '500'}; font-size:12.5px; cursor:pointer;">Std ${g}</button>`;
  }).join('');
  btnRow.querySelectorAll('button').forEach(btn => {
    btn.addEventListener('click', () => {
      overrideGrade = btn.dataset.grade;
      activeMonth = 0;
      const tag = document.getElementById('bandTag');
      const newBand = getGradeBand();
      if (newBand && tag) tag.textContent = newBand.band + ' · Std ' + overrideGrade;
      renderTestGradeButtons();
      renderMonthTabs();
      renderTasks();
    });
  });
}

// ===================================================================
// WEEKLY-STYLE BONUS ASSIGNMENT — one extra optional creative task per
// month, separate from the 4 core missions. Student uploads a photo
// (optional) + a text description; the same AI proxy used for grading
// missions reviews it and awards bonus coins if it's a genuine effort.
// These become a personal keepsake collection for the student (photo +
// description of what they made) — purely for their own record and fun,
// not framed as career/job-outcome material. Future Studio is exploration
// only; any job-related features (the Jobs Tab) belong solely to the
// paid vocational courses, gated to Masterclass-tier completion + 18+.
// ===================================================================
let bonusImageFile = null;

function renderBonusCard(){
  const wrap = document.getElementById('bonusCardWrap');
  const m = getMonths()[activeMonth];
  if (!m.bonusAssignment){ wrap.innerHTML = ''; return; }
  const key = 'm' + activeMonth;

  const statusText = existing
    ? (existing.status === 'passed' ? `✅ Submitted — +${existing.coinsAwarded} bonus coins earned!` : '✏️ Submitted — tap to try again for more bonus coins')

  document.getElementById('bonusCardEl').onclick = () => openBonusAssignment(m.bonusAssignment, key);

function openBonusAssignment(assignment, key){
  const overlay = document.getElementById('vmOverlay');
  const modal = document.getElementById('vmModal');
  overlay.style.display = 'flex';
  bonusImageFile = null;
  modal.innerHTML = `
    <button class="vm-close" onclick="closeVisualMission()">&times;</button>
    <h3 class="vm-title">🎁 ${t(assignment.title)}</h3>
    <p style="color:#e8ddff;font-size:13.5px;margin-bottom:14px;">${t(assignment.prompt)}</p>
    <div class="upload-drop" id="bonusUploadDrop">
      <div class="upload-hint">📷 Tap to add a photo (optional)</div>
      <input type="file" id="bonusFileInput" accept="image/*" style="display:none;">
    </div>
    <textarea id="bonusDesc" rows="4" placeholder="Describe what you made or learned..." style="width:100%;padding:10px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.05);color:#fff;font-family:inherit;margin-top:10px;"></textarea>
    <button class="vm-done-btn" id="bonusSubmitBtn" style="margin-top:12px;">Submit Assignment →</button>
  `;
  document.getElementById('bonusUploadDrop').onclick = () => document.getElementById('bonusFileInput').click();
  document.getElementById('bonusFileInput').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if (!file) return;
    bonusImageFile = file;
    const reader = new FileReader();
    reader.onload = (ev) => {
      document.getElementById('bonusUploadDrop').innerHTML = `<img src="${ev.target.result}" alt="Preview"><div class="upload-hint">Tap to change photo</div>`;
      document.getElementById('bonusUploadDrop').onclick = () => document.getElementById('bonusFileInput').click();
    };
    reader.readAsDataURL(file);
  });
  document.getElementById('bonusSubmitBtn').addEventListener('click', ()=> submitBonusAssignment(assignment, key));
}

async function submitBonusAssignment(assignment, key){
  const desc = document.getElementById('bonusDesc').value.trim();
  if (!desc){ alert('Please describe your work before submitting.'); return; }
  const btn = document.getElementById('bonusSubmitBtn');
  btn.disabled = true; btn.textContent = 'Submitting...';

  let imageURL = null;
  try {
    if (bonusImageFile){
      const storageRef = ref(storage, `bonus-assignments/${uid}/${SLUG}/${key}-${Date.now()}.jpg`);
      await uploadBytes(storageRef, bonusImageFile);
      imageURL = await getDownloadURL(storageRef);
    }
  } catch(e){ console.warn('Image upload failed (continuing without it):', e); }

  const gradingSystemPrompt = `You are grading a bonus creative assignment for a Std ${student.grade || 6} student on the "${assignment.title}" theme in ${PROFILE.title}. Be warm and encouraging — this is a bonus, low-stakes creative task, not a strict test. Respond with ONLY valid JSON, no markdown: {"passed": true or false, "bonusCoins": a number 0-30, "feedback": "2-3 encouraging sentences"}. Give bonusCoins based on genuine effort and engagement, not perfection — most real attempts should pass with at least some coins; only fail something that's clearly nonsense or copy-pasted.`;

  try {
    const res = await fetch(GRADE_PROXY_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ system: gradingSystemPrompt, messages: [{ role:'user', content: `Student's description of their work:\n\n${desc}` }] })
    });
    const raw = await res.json();
    const rawText = (raw.content && raw.content[0] && raw.content[0].text) || '{}';
    let result;
    try { result = JSON.parse(rawText.replace(/```json|```/g,'').trim()); }
    catch { result = { passed:true, bonusCoins:10, feedback:"Nice work — thanks for sharing!" }; }

    const record = {
      status: result.passed ? 'passed' : 'needs_revision',
      description: desc, imageURL,
      aiFeedback: result.feedback || '',
      coinsAwarded: result.passed ? (result.bonusCoins || 10) : 0,
      submittedAt: new Date().toISOString()
    };
    student.bonusAssignments = student.bonusAssignments || {};
    student.bonusAssignments[SLUG] = student.bonusAssignments[SLUG] || {};
    student.bonusAssignments[SLUG][key] = record;

    const fsUpdate = { [`bonusAssignments.${SLUG}.${key}`]: record };
    if (result.passed) fsUpdate.coins = increment(record.coinsAwarded);
    await updateDoc(doc(db,'students',uid), fsUpdate).catch(e=>console.warn(e));
    if (result.passed){ coins += record.coinsAwarded; renderCoins(); }

    const modal = document.getElementById('vmModal');
    modal.innerHTML = `
      <div style="text-align:center;padding:24px 10px;">
        <div style="font-size:52px;margin-bottom:10px;">${result.passed ? '🎉' : '💪'}</div>
        <h3 style="margin:0 0 8px;">${result.passed ? `+${record.coinsAwarded} Bonus Coins!` : "Keep going!"}</h3>
        <p style="color:#e8ddff;font-size:13.5px;">${result.feedback || ''}</p>
      </div>`;
    setTimeout(()=>{ closeVisualMission(); renderTasks(); }, 2400);
  } catch(e){
    console.error('Bonus assignment grading failed', e);
    btn.disabled = false; btn.textContent = 'Submit Assignment →';
    alert('Something went wrong grading your assignment — please try again.');
  }
}

// Dr. Arjun — Future Studio's Doctor & Healthcare mentor. Uses each task's own
// hand-written mentorIntro/mentorVisual when present (richer, specific to that
// exact mission); falls back to a generic line for tasks not yet authored.
// Supports English/Hindi/Marathi — both spoken (browser text-to-speech) and
// written — with a 🔊 Listen button per mission.
const MENTOR = { name: "Dr. Arjun", avatarImg: "assets/mentors/mentor-arjun-avatar.jpg" };
let currentLang = 'en';
const LANG_LABELS = { en: "English", hi: "हिंदी", mr: "मराठी" };
const LANG_CODES = { en: "en-IN", hi: "hi-IN", mr: "mr-IN" };

// Static UI strings (buttons, hints, progress counters) that need to switch
// language alongside the mentor's own dialogue — not just the spoken line.
const UI = {
  tapHint: { en:"👆 Tap a spot above to discover something new!", hi:"👆 कुछ नया जानने के लिए ऊपर किसी जगह को छुओ!", mr:"👆 काहीतरी नवीन जाणून घेण्यासाठी वर एखाद्या जागेला स्पर्श करा!" },
  exploreProgress: { en:n=>`Explore all spots first (${n})`, hi:n=>`पहले सभी जगहों को देखो (${n})`, mr:n=>`आधी सर्व जागा एक्सप्लोर करा (${n})` },
  completeMission: { en:"Complete Mission →", hi:"मिशन पूरा करो →", mr:"मिशन पूर्ण करा →" },
  dragHint: { en:"🖐️ Drag each chip onto a matching box!", hi:"🖐️ हर चिप को सही बॉक्स में खींचकर रखो!", mr:"🖐️ प्रत्येक चिप योग्य बॉक्समध्ये ड्रॅग करा!" },
  placeProgress: { en:n=>`Place all pieces first (${n})`, hi:n=>`पहले सभी टुकड़े रखो (${n})`, mr:n=>`आधी सर्व तुकडे ठेवा (${n})` },
};
// t(dict) picks the current language's value, falling back to English;
// t(dict, arg) supports UI strings that are functions of a progress count.
function t(dict, ...args){
  if (!dict) return '';
  if (typeof dict === 'string') return dict; // plain string — not yet translated, use as-is
  const v = dict[currentLang] || dict.en || '';
  return typeof v === 'function' ? v(...args) : v;
}

function mentorIntroHTML(task, taskKey){
  const dialogue = task.mentorIntro || { en: `Let's explore "${task.title}" together — take your time, and remember: every attempt teaches you something!` };
  const visual = task.mentorVisual ? `<div style="font-size:32px;line-height:1;margin-bottom:2px;">${task.mentorVisual}</div>` : '';
  const langButtons = Object.keys(LANG_LABELS).filter(l => dialogue[l]).map(l =>
    `<button class="lang-btn ${l===currentLang?'active':''}" onclick="setLang('${l}','${taskKey}')">${LANG_LABELS[l]}</button>`
  ).join('');
  return `<div class="mentor-intro">
    <div class="mentor-face-wrap"><img src="${MENTOR.avatarImg}" alt="${MENTOR.name}" style="width:52px;height:52px;border-radius:50%;object-fit:cover;border:2px solid var(--gold);display:block;"></div>
    <div>${visual}<b>${MENTOR.name} says</b>
      <p id="mentorText-${taskKey}">${dialogue[currentLang] || dialogue.en}</p>
      <div class="mentor-lang-row">${langButtons}
        <button class="speak-btn" onclick="speakMentor('${taskKey}')">🔊 Listen</button>
        <button class="speak-btn" onclick="startVoiceChat('${taskKey}')" id="voiceBtn-${taskKey}">🎤 Ask Dr. Arjun</button>
      </div>
      <div id="voiceChatBox-${taskKey}" style="display:none;margin-top:10px;background:rgba(255,255,255,.04);border-radius:10px;padding:10px 12px;">
        <p style="font-size:12px;color:var(--muted);margin:0 0 4px;" id="voiceYouSaid"></p>
        <p style="font-size:13.5px;color:#fff;margin:0;" id="voiceMentorReply"></p>
      </div>
    </div>
  </div>`;
}

// Tracks whichever task is currently open, so switching language can fully
// redraw it (hotspots, chips, buttons — not just the mentor's own paragraph).
let currentOpenTaskId = null, currentOpenTask = null, currentOpenIsVisual = false;

window.setLang = (lang, taskKey) => {
  currentLang = lang;
  if (currentOpenTask){
    if (currentOpenIsVisual) openVisualMission(currentOpenTaskId, currentOpenTask);
    else openModal(currentOpenTaskId, currentOpenTask);
  }
};

window.speakMentor = (taskKey) => {
  const dialogue = currentOpenTask ? currentOpenTask.mentorIntro : null;
  if (!dialogue) return;
  const text = dialogue[currentLang] || dialogue.en;
  if (!('speechSynthesis' in window)){ alert('Text-to-speech is not supported in this browser.'); return; }
  window.speechSynthesis.cancel();
  const utter = new SpeechSynthesisUtterance(text);
  utter.lang = LANG_CODES[currentLang] || 'en-IN';
  utter.rate = 0.95;
  window.speechSynthesis.speak(utter);
};

// Voice conversation: student speaks -> browser transcribes -> same AI proxy
// used for grading generates Dr. Arjun's reply -> spoken back aloud.
// Reuses GRADE_PROXY_URL (already proven working for grading) with a
// conversational system prompt instead of a grading one.
window.startVoiceChat = (taskKey) => {
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if (!SpeechRecognition){ alert('Voice input is not supported in this browser — try Chrome.'); return; }
  if (!currentOpenTask) return;

  const btn = document.getElementById('voiceBtn-'+taskKey);
  const box = document.getElementById('voiceChatBox-'+taskKey);
  const youSaidEl = document.getElementById('voiceYouSaid');
  const replyEl = document.getElementById('voiceMentorReply');

  const recognition = new SpeechRecognition();
  recognition.lang = LANG_CODES[currentLang] || 'en-IN';
  recognition.interimResults = false;
  recognition.maxAlternatives = 1;

  btn.disabled = true; btn.textContent = '🎤 Listening...';
  box.style.display = 'block';
  youSaidEl.textContent = '';
  replyEl.textContent = '';

  recognition.onresult = async (event) => {
    const transcript = event.results[0][0].transcript;
    youSaidEl.textContent = `You: "${transcript}"`;
    btn.textContent = '🎤 Thinking...';

    const langName = { en:"English", hi:"Hindi", mr:"Marathi" }[currentLang] || "English";
    const mentorSystemPrompt = `You are Dr. Arjun, a warm, encouraging Doctor & Healthcare mentor for an Indian student in grades 6-12, currently on the mission "${currentOpenTask.title}". Answer their question simply and kindly in ${langName}, in 2-3 short sentences — age-appropriate, never giving real medical diagnoses or advice about a real person's actual health, just friendly educational explanation tied to what they're learning.`;

    try {
      const res = await fetch(GRADE_PROXY_URL, {
        method: 'POST', headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({
          system: mentorSystemPrompt,
          messages: [{ role: 'user', content: transcript }]
        })
      });
      const raw = await res.json();
      const replyText = (raw.content && raw.content[0] && raw.content[0].text) || "Sorry, I didn't quite catch that — try asking again!";
      replyEl.textContent = `${MENTOR.name}: ${replyText}`;
      if ('speechSynthesis' in window){
        window.speechSynthesis.cancel();
        const utter = new SpeechSynthesisUtterance(replyText);
        utter.lang = LANG_CODES[currentLang] || 'en-IN';
        utter.rate = 0.95;
        window.speechSynthesis.speak(utter);
      }
    } catch(e){
      console.warn('Voice chat failed', e);
      replyEl.textContent = `${MENTOR.name}: Sorry, I couldn't hear back properly — try again in a moment.`;
    }
    btn.disabled = false; btn.textContent = '🎤 Ask Dr. Arjun';
  };
  recognition.onerror = () => {
    btn.disabled = false; btn.textContent = '🎤 Ask Dr. Arjun';
    youSaidEl.textContent = "Didn't catch that — try again.";
  };
  recognition.start();
};

function openModal(id, task){

  document.getElementById('submitTitle').textContent = task.title;
  document.getElementById('submitMentorIntro').innerHTML = mentorIntroHTML(task, id);
  document.getElementById('submitDesc').textContent = t(task.desc);

  document.getElementById('submitFeedback').style.display = sub && sub.aiFeedback ? 'block' : 'none';
  document.getElementById('submitFeedback').textContent = sub ? (sub.aiFeedback || '') : '';
  document.getElementById('submitStatus').textContent = '';
  const btn = document.getElementById('submitBtn');

  btn.textContent = 'Submit for grading';
  btn.onclick = () => submitMission(id, task);

async function submitMission(id, task){
  const answer = document.getElementById('submitAnswer').value.trim();
  if (!answer){ document.getElementById('submitStatus').textContent = 'Write your answer before submitting.'; return; }
  const alreadyPassed = isDone(id); // was this task already passed BEFORE this attempt?
  const btn = document.getElementById('submitBtn');
  btn.disabled = true;
  document.getElementById('submitStatus').textContent = 'Sending for grading...';

  try {
    const gradingSystemPrompt = `You are grading a student's mission submission for the Waves4Youth "${SLUG}" track.
Task: "${task.title}" (type: ${task.type})
What a good answer should show: ${task.desc}

Grade the student's answer below. Be encouraging but honest — this is a student in grades 6-12.
Respond with ONLY valid JSON, no markdown, no preamble, in exactly this shape:
{"passed": true or false, "score": 0-10, "feedback": "2-3 sentences of specific, encouraging feedback"}

A "pass" means the student engaged genuinely with the task and shows real understanding —
not perfection. Be generous with effort, strict about copy-pasted or nonsense answers.`;

    const res = await fetch(GRADE_PROXY_URL, {
      method: 'POST', headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({
        system: gradingSystemPrompt,
        messages: [{ role: 'user', content: `Student's answer:\n\n${answer}` }]
      })
    });
    const raw = await res.json();
    const rawText = (raw.content && raw.content[0] && raw.content[0].text) || '{}';
    let result;
    try {
      result = JSON.parse(rawText.replace(/```json|```/g, '').trim());
    } catch {
      result = { passed: false, score: 0, feedback: "Grading hiccup — please try submitting again." };
    }
    const record = { status: result.passed ? 'passed' : 'needs_revision', textAnswer: answer, aiScore: result.score||null, aiFeedback: result.feedback||'', submittedAt: new Date().toISOString(), coinsAwarded: !!result.passed };
    MissionEngine.recordSubmissionLocally(id, record);
    await updateDoc(doc(db,'students',uid), { [`missionSubmissions.${SLUG}.${id}`]: record }).catch(e=>console.warn(e));

    document.getElementById('submitFeedback').style.display = 'block';
    document.getElementById('submitFeedback').textContent = record.aiFeedback;
    document.getElementById('submitStatus').textContent = result.passed
      ? (alreadyPassed ? "Passed again — nice review! (Coins already earned the first time.)" : "🎉 Hurray! You've earned 10 W4Y Coins!")
      : 'Not quite — read the feedback and try again.';
    btn.disabled = false; btn.textContent = result.passed ? 'Passed' : 'Resubmit';

    if (result.passed && !alreadyPassed){
      coins += 10; renderCoins();
      updateDoc(doc(db,'students',uid), {
        coins: increment(10),
        biographyEvents: arrayUnion({ grade: student.grade || null, profession: SLUG, event: task.title, at: new Date().toISOString() })
      }).catch(e=>console.warn(e));
      recordFreeTaskIfNeeded();
      if (monthTaskIds(activeMonth).every(isDone)){
        coins += 50; renderCoins();
        updateDoc(doc(db,'students',uid), { coins: increment(50) }).catch(e=>console.warn(e));
        showMonthlyMomento();
      }
    }
    renderTasks(); renderMonthTabs();
  } catch(e){
    console.error(e);
    document.getElementById('submitStatus').textContent = "Couldn't reach the grading system — please try again.";
    btn.disabled = false; btn.textContent = 'Submit for grading';
  }
}
/* ===================================================================
   VISUAL MISSION ENGINES — reusable, data-driven mini-games.
   Two engines cover Std 6 Explorer content: "tap-discover" (no stakes,
   pure curiosity) and "build-match" (drag chip to zone; noStakes:true
   means every placement is accepted and shows its fact, no wrong answer).
   Adding a new month's content never needs new code — only new data
   in profession-catalog.js. New engines (e.g. "branching" for Specialist
   band) can be added the same way later.
=================================================================== */

function openVisualMission(id, task){
  currentOpenTaskId = id; currentOpenTask = task; currentOpenIsVisual = true;
  const overlay = document.getElementById('vmOverlay');
  const modal = document.getElementById('vmModal');
  overlay.style.display = 'flex';

  if (task.engine === 'tap-discover') renderTapDiscover(modal, id, task);
  else if (task.engine === 'build-match') renderBuildMatch(modal, id, task);
  else if (task.engine === 'flip-cards') renderFlipCards(modal, id, task);
  else if (task.engine === 'true-false') renderTrueFalse(modal, id, task);
  else if (task.engine === 'branching') renderBranching(modal, id, task);
  else modal.innerHTML = '<p style="color:#fff">This mission type is not supported yet.</p>';
}

function closeVisualMission(){
  document.getElementById('vmOverlay').style.display = 'none';
}
window.closeVisualMission = closeVisualMission;

function renderTapDiscover(modal, id, task){
  const data = task.data;
  let discovered = new Set();
  const visualHTML = animatedVisualHTML(data.animation, data.visual)
    || `<div class="td-visual">${data.visual}</div>`;
  modal.innerHTML = `
    <button class="vm-close" onclick="closeVisualMission()">&times;</button>
    <h3 class="vm-title">${task.icon} ${task.title}</h3>
    ${mentorIntroHTML(task, id)}
    ${visualHTML}
    <div class="td-hotspots">${data.hotspots.map((h,i)=>`<div class="td-hotspot" data-i="${i}">${t(h.label)}</div>`).join('')}</div>
    <div class="td-fact" id="tdFact">${t(UI.tapHint)}</div>
    <button class="vm-done-btn" id="tdDoneBtn" disabled>${t(UI.exploreProgress, `0/${data.hotspots.length}`)}</button>
  `;
  modal.querySelectorAll('.td-hotspot').forEach(el=>{
    el.addEventListener('click', ()=>{
      const i = parseInt(el.dataset.i);
      el.classList.add('tapped');
      document.getElementById('tdFact').textContent = t(data.hotspots[i].fact);
      discovered.add(i);
      const btn = document.getElementById('tdDoneBtn');
      btn.disabled = discovered.size < data.hotspots.length;
      btn.textContent = discovered.size < data.hotspots.length
        ? t(UI.exploreProgress, `${discovered.size}/${data.hotspots.length}`)
        : t(UI.completeMission);
    });
  });
  document.getElementById('tdDoneBtn').addEventListener('click', ()=> completeVisualMission(id, task));
}

function renderBuildMatch(modal, id, task){
  const data = task.data;
  let placed = {};
  const chipLabel = (chipId) => { const z = data.zones.find(z=>z.id===chipId); return z ? t(z.label) : chipId; };
  modal.innerHTML = `
    <button class="vm-close" onclick="closeVisualMission()">&times;</button>
    <h3 class="vm-title">${task.icon} ${task.title}</h3>
    ${mentorIntroHTML(task, id)}
    <div class="bm-zones">${data.zones.map(z=>`<div class="bm-zone" data-zone="${z.id}">${t(z.label)}</div>`).join('')}</div>
    <div class="bm-bank" id="bmBank">${data.chips.map(c=>`<div class="bm-chip" draggable="true" data-chip="${c}">${chipLabel(c)}</div>`).join('')}</div>
    <div class="td-fact" id="bmFact">${t(UI.dragHint)}</div>
    <button class="vm-done-btn" id="bmDoneBtn" disabled>${t(UI.placeProgress, `0/${data.chips.length}`)}</button>
  `;
  const chips = modal.querySelectorAll('.bm-chip');
  const zones = modal.querySelectorAll('.bm-zone');
  chips.forEach(chip=>{
    chip.addEventListener('dragstart', e=> e.dataTransfer.setData('text/plain', chip.dataset.chip));
  });
  zones.forEach(zone=>{
    zone.addEventListener('dragover', e=> e.preventDefault());
    zone.addEventListener('drop', e=>{
      e.preventDefault();
      if (zone.classList.contains('filled')) return;
      const chipVal = e.dataTransfer.getData('text/plain');
      if (!data.noStakes && chipVal !== zone.dataset.zone) return; // strict mode for later bands
      zone.classList.add('filled');
      placed[chipVal] = true;
      const chipEl = [...chips].find(c=>c.dataset.chip===chipVal);
      if (chipEl) chipEl.classList.add('used');
      if (data.facts && data.facts[chipVal]) document.getElementById('bmFact').textContent = t(data.facts[chipVal]);
      const count = Object.keys(placed).length;
      const btn = document.getElementById('bmDoneBtn');
      btn.disabled = count < data.chips.length;
      btn.textContent = count < data.chips.length
        ? t(UI.placeProgress, `${count}/${data.chips.length}`)
        : t(UI.completeMission);
    });
  });
  document.getElementById('bmDoneBtn').addEventListener('click', ()=> completeVisualMission(id, task));
}

function renderFlipCards(modal, id, task){
  const data = task.data;
  let flippedCount = 0;
  modal.innerHTML = `
    <button class="vm-close" onclick="closeVisualMission()">&times;</button>
    <h3 class="vm-title">${task.icon} ${task.title}</h3>
    ${mentorIntroHTML(task, id)}
    <div class="fc-grid">${data.cards.map((c,i)=>`<div class="fc-card" data-i="${i}">${t(c.front)}</div>`).join('')}</div>
    <button class="vm-done-btn" id="fcDoneBtn" disabled>Flip all cards first (0/${data.cards.length})</button>
  `;
  modal.querySelectorAll('.fc-card').forEach(card=>{
    card.addEventListener('click', ()=>{
      if (card.classList.contains('flipped')) return;
      const i = parseInt(card.dataset.i);
      card.classList.add('flipped');
      card.textContent = t(data.cards[i].back);
      flippedCount++;
      const btn = document.getElementById('fcDoneBtn');
      btn.disabled = flippedCount < data.cards.length;
      btn.textContent = flippedCount < data.cards.length ? `Flip all cards first (${flippedCount}/${data.cards.length})` : t(UI.completeMission);
    });
  });
  document.getElementById('fcDoneBtn').addEventListener('click', ()=> completeVisualMission(id, task));
}

function renderTrueFalse(modal, id, task){
  const data = task.data;
  let answered = 0;
  modal.innerHTML = `
    <button class="vm-close" onclick="closeVisualMission()">&times;</button>
    <h3 class="vm-title">${task.icon} ${task.title}</h3>
    ${mentorIntroHTML(task, id)}
    ${data.statements.map((s,i)=>`
      <div class="tf-item" data-i="${i}">
        <div class="tf-text">${t(s.text)}</div>
        <div class="tf-btns">
          <button class="tf-btn" data-val="true">True</button>
          <button class="tf-btn" data-val="false">False</button>
        </div>
        <div class="tf-explain">${t(s.explain)}</div>
      </div>`).join('')}
    <button class="vm-done-btn" id="tfDoneBtn" disabled>Answer all first (0/${data.statements.length})</button>
  `;
  modal.querySelectorAll('.tf-item').forEach(item=>{
    const i = parseInt(item.dataset.i);
    const correct = data.statements[i].answer;
    item.querySelectorAll('.tf-btn').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if (item.querySelector('.tf-btn.correct, .tf-btn.wrong')) return;
        const chosen = btn.dataset.val === 'true';
        btn.classList.add(chosen === correct ? 'correct' : 'wrong');
        item.querySelector('.tf-explain').style.display = 'block';
        answered++;
        const doneBtn = document.getElementById('tfDoneBtn');
        doneBtn.disabled = answered < data.statements.length;
        doneBtn.textContent = answered < data.statements.length ? `Answer all first (${answered}/${data.statements.length})` : t(UI.completeMission);
      });
    });
  });
  document.getElementById('tfDoneBtn').addEventListener('click', ()=> completeVisualMission(id, task));
}

// Branching scenario engine — Specialist band's signature mechanic. A real
// judgment call: present a situation, offer choices of differing quality
// (not just right/wrong), show the real consequence of that choice, then
// move to the next step. Ends with a genuine "Complete Mission" moment.
function renderBranching(modal, id, task){
  const data = task.data;
  let stepIndex = 0;

  function renderStep(){
    const step = data.steps[stepIndex];
    const isLastStep = stepIndex === data.steps.length - 1;
    modal.innerHTML = `
      <button class="vm-close" onclick="closeVisualMission()">&times;</button>
      <h3 class="vm-title">${task.icon} ${task.title}</h3>
      ${stepIndex === 0 ? mentorIntroHTML(task, id) : ''}
      <div class="br-situation">
        <div class="br-step-tag">Step ${stepIndex+1} of ${data.steps.length}</div>
        ${t(step.situation)}
      </div>
      <div id="brChoices">${step.choices.map((c,i)=>`<button class="br-choice" data-i="${i}">${t(c.label)}</button>`).join('')}</div>
      <div id="brOutcomeArea"></div>
    `;
    modal.querySelectorAll('.br-choice').forEach(btn=>{
      btn.addEventListener('click', ()=>{
        if (modal.querySelector('.br-choice.picked-best, .br-choice.picked-ok')) return; // already chosen
        const i = parseInt(btn.dataset.i);
        const choice = step.choices[i];
        btn.classList.add(choice.quality === 'best' ? 'picked-best' : 'picked-ok');
        document.getElementById('brOutcomeArea').innerHTML = `
          <div class="br-outcome">${t(choice.outcome)}</div>
          <button class="vm-done-btn" id="brContinueBtn">${isLastStep ? t(UI.completeMission) : 'Continue →'}</button>
        `;
        document.getElementById('brContinueBtn').addEventListener('click', ()=>{
          if (isLastStep) completeVisualMission(id, task);
          else { stepIndex++; renderStep(); }
        });
      });
    });
  }
  renderStep();
}

async function completeVisualMission(id, task){
  const alreadyPassed = isDone(id); // was this task already passed BEFORE this attempt?
  const record = { status: 'passed', engine: task.engine, submittedAt: new Date().toISOString(), coinsAwarded: !alreadyPassed };
  MissionEngine.recordSubmissionLocally(id, record);

  const firestoreUpdate = { [`missionSubmissions.${SLUG}.${id}`]: record };
  if (!alreadyPassed){
    firestoreUpdate.coins = increment(10);
    firestoreUpdate.biographyEvents = arrayUnion({
      grade: student.grade || null,
      profession: SLUG,
      event: task.title,
      at: new Date().toISOString()
    });
  }
  await updateDoc(doc(db,'students',uid), firestoreUpdate).catch(e=>console.warn('completeVisualMission write failed', e));

  if (!alreadyPassed){
    coins += 10; renderCoins();
    recordFreeTaskIfNeeded();
    if (monthTaskIds(activeMonth).every(isDone)){
      coins += 50; renderCoins();
      updateDoc(doc(db,'students',uid), { coins: increment(50) }).catch(e=>console.warn(e));
    }
  }

  const modal = document.getElementById('vmModal');
  const monthJustCompleted = !alreadyPassed && monthTaskIds(activeMonth).every(isDone);
  modal.innerHTML = `
    <div style="text-align:center;padding:20px 10px;">
      <div style="font-size:52px;margin-bottom:10px;">🎉</div>
      <h3 style="margin:0 0 8px;">${alreadyPassed ? "Nice review!" : "Hurray! You did it!"}</h3>
      <p style="color:#e8ddff;font-size:14px;">${alreadyPassed ? "You've already earned coins for this one — great practice though!" : "You've earned 10 W4Y Coins! 🪙"}</p>
    </div>`;
  setTimeout(()=>{
    if (monthJustCompleted) showMonthlyMomento();
    else { closeVisualMission(); renderTasks(); renderMonthTabs(); }
  }, 1400);
}

// ===================================================================
// MONTHLY MOMENTO + YEAR-END REWARD LADDER
// A collectible reveal every time a student finishes all 4 tasks in a
// month — builds toward the real, physical year-end gift, tiered by
// total coins earned in this profession (see PROFILE.rewardTiers).
// ===================================================================
function showMonthlyMomento(){
  document.getElementById('submitModal').style.display = 'none'; // in case called from a text-task submission
  document.getElementById('vmOverlay').style.display = 'flex';
  const modal = document.getElementById('vmModal');
  const monthLabel = getMonths()[activeMonth].label;
  const isLastMonth = activeMonth === getMonths().length - 1;
  modal.innerHTML = `
    <div style="text-align:center;padding:24px 10px;">
      <div style="font-size:60px;margin-bottom:10px;">🎖️</div>
      <h3 style="margin:0 0 8px;">Monthly Momento Earned!</h3>
      <p style="color:#e8ddff;font-size:14px;margin-bottom:16px;">You've completed <b>${monthLabel}</b> — this month's momento is added to your collection.</p>
      <button class="vm-done-btn" id="momentoContinueBtn">${isLastMonth ? "See Your Year-End Gift →" : "Continue →"}</button>
    </div>`;
  document.getElementById('momentoContinueBtn').addEventListener('click', ()=>{
    if (isLastMonth) showYearEndReward();
    else { closeVisualMission(); renderTasks(); renderMonthTabs(); }
  });
}

function showYearEndReward(){
  const modal = document.getElementById('vmModal');
  const tiers = PROFILE.rewardTiers || [];
  const earned = [...tiers].reverse().find(tier => coins >= tier.minCoins);
  modal.innerHTML = earned ? `
    <div style="text-align:center;padding:20px 10px;">
      <div style="font-size:70px;margin-bottom:10px;">${earned.icon}</div>
      <h3 style="margin:0 0 8px;">🎉 You've earned a real gift!</h3>
      <p style="color:#e8ddff;font-size:14px;margin-bottom:6px;">With <b>${coins} coins</b> earned this year, you've unlocked:</p>
      <p style="color:var(--gold);font-size:16px;font-weight:700;margin-bottom:16px;">${earned.item}</p>
      <button class="vm-done-btn" id="claimGiftBtn">Claim My Gift →</button>
    </div>` : `
    <div style="text-align:center;padding:20px 10px;">
      <div style="font-size:52px;margin-bottom:10px;">🌱</div>
      <h3 style="margin:0 0 8px;">Great year of learning!</h3>
      <p style="color:#e8ddff;font-size:14px;">You're close to your first reward tier — keep earning coins next year to unlock a real W4Y gift!</p>
    </div>`;
  if (earned){
    document.getElementById('claimGiftBtn').addEventListener('click', ()=> showGiftAddressForm(earned));
  }
}

function showGiftAddressForm(earned){
  const modal = document.getElementById('vmModal');
  modal.innerHTML = `
    <button class="vm-close" onclick="closeVisualMission()">&times;</button>
    <h3 class="vm-title">${earned.icon} Claim: ${earned.item}</h3>
    <p style="color:#e8ddff;font-size:13px;margin-bottom:14px;">We just need a shipping address to send your gift — this is only collected now, when you're actually claiming it.</p>
    <input id="giftName" placeholder="Full name" style="width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;">
    <textarea id="giftAddress" placeholder="Full shipping address, including PIN code" rows="3" style="width:100%;padding:10px;margin-bottom:8px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;font-family:inherit;"></textarea>
    <input id="giftPhone" placeholder="Contact number for delivery" style="width:100%;padding:10px;margin-bottom:14px;border-radius:8px;border:1px solid var(--border);background:rgba(255,255,255,.06);color:#fff;">
    <button class="vm-done-btn" id="submitGiftBtn">Submit for Delivery →</button>
  `;
  document.getElementById('submitGiftBtn').addEventListener('click', async ()=>{
    const name = document.getElementById('giftName').value.trim();
    const address = document.getElementById('giftAddress').value.trim();
    const phone = document.getElementById('giftPhone').value.trim();
    if (!name || !address || !phone){ alert('Please fill all fields so we can deliver your gift.'); return; }
    await updateDoc(doc(db,'students',uid), {
      [`giftRedemptions.${SLUG}`]: {
        item: earned.item, coinsAtRedemption: coins, name, address, phone,
        status: 'Pending Fulfillment', requestedAt: new Date().toISOString()
      }
    }).catch(e=>console.warn('Gift redemption save failed', e));
    modal.innerHTML = `<div style="text-align:center;padding:30px 10px;"><div style="font-size:52px;margin-bottom:10px;">📦</div><h3>Gift request sent!</h3><p style="color:#e8ddff;font-size:14px;">Your ${earned.item} is on its way to being shipped. 🎉</p></div>`;
    setTimeout(()=>{ closeVisualMission(); renderTasks(); renderMonthTabs(); }, 2200);
  });
}
</script>

</body>
</html>
